spring:
  application:
    name: usuario-service

  datasource:
    # As variaveis de ambiente tem um valor padrao apos os dois-pontos
    # (ex: localhost, 5432), usado quando rodamos localmente sem Docker.
    # No docker-compose.yml essas variaveis sao sobrescritas para apontar
    # para o servico "db" da rede interna do Compose.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techchallenge}
    username: ${DB_USER:techchallenge}
    password: ${DB_PASSWORD:techchallenge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update: cria/ajusta as tabelas automaticamente a partir das
      # entidades. Ótimo para desenvolvimento e para este desafio;
      # em um sistema real de producao o ideal seria usar uma ferramenta
      # de migration (Flyway/Liquibase) em vez de deixar o Hibernate
      # alterar o schema sozinho.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

# JWT (desafio extra: autenticacao com Spring Security + JWT).
# O valor padrao do secret so serve para desenvolvimento local; em producao
# deve vir sempre de uma variavel de ambiente / secret manager.
jwt:
  secret: ${JWT_SECRET:chave-secreta-de-desenvolvimento-tech-challenge-fase1-conectamesa-2026-troque-em-producao}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Swagger/OpenAPI ficam disponiveis em /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
