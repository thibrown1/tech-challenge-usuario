services:
  db:
    image: postgres:16-alpine
    container_name: techchallenge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: techchallenge
      POSTGRES_USER: techchallenge
      POSTGRES_PASSWORD: techchallenge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techchallenge"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: techchallenge-app
    restart: unless-stopped
    # A app so sobe DEPOIS que o banco estiver pronto para aceitar
    # conexoes (nao so "iniciado", mas de fato saudavel).
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: techchallenge
      DB_USER: techchallenge
      DB_PASSWORD: techchallenge
      SERVER_PORT: 8080
      JWT_SECRET: chave-secreta-de-desenvolvimento-tech-challenge-fase1-conectamesa-2026-troque-em-producao
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"

volumes:
  db_data:
